distilabel:
  version: 1.5.3
pipeline:
  name: extract_speakers
  description: null
  steps:
  - step:
      name: from_db_0
      resources:
        replicas: 1
        cpus: null
        gpus: null
        memory: null
        resources: null
      input_mappings: {}
      output_mappings: {}
      use_cache: true
      batch_size: 50
      dbPath: db/axiom.db
      sql: "\n            SELECT *\n            FROM sections s\n        "
      runtime_parameters_info:
      - name: resources
        runtime_parameters_info:
        - name: replicas
          optional: true
          description: The number of replicas for the step.
        - name: cpus
          optional: true
          description: The number of CPUs assigned to each step replica.
        - name: gpus
          optional: true
          description: The number of GPUs assigned to each step replica.
        - name: memory
          optional: true
          description: The memory in bytes required for each step replica.
        - name: resources
          optional: true
          description: A dictionary containing names of custom resources and the number
            of those resources required for each step replica.
      - name: batch_size
        optional: true
        description: The number of rows that will contain the batches generated by
          the step.
      type_info:
        module: custom_modules.utils
        name: FromDb
    name: from_db_0
  - step:
      name: extract_speaker_0
      resources:
        replicas: 1
        cpus: null
        gpus: null
        memory: null
        resources: null
      input_mappings: {}
      output_mappings: {}
      use_cache: true
      input_batch_size: 50
      mpListFilePath: ./hansard/mps.json
      runtime_parameters_info:
      - name: resources
        runtime_parameters_info:
        - name: replicas
          optional: true
          description: The number of replicas for the step.
        - name: cpus
          optional: true
          description: The number of CPUs assigned to each step replica.
        - name: gpus
          optional: true
          description: The number of GPUs assigned to each step replica.
        - name: memory
          optional: true
          description: The memory in bytes required for each step replica.
        - name: resources
          optional: true
          description: A dictionary containing names of custom resources and the number
            of those resources required for each step replica.
      - name: input_batch_size
        optional: true
        description: The number of rows that will contain the batches processed by
          the step.
      type_info:
        module: custom_modules.axiom
        name: ExtractSpeaker
    name: extract_speaker_0
  - step:
      name: keep_columns_0
      resources:
        replicas: 1
        cpus: null
        gpus: null
        memory: null
        resources: null
      input_mappings: {}
      output_mappings: {}
      use_cache: true
      input_batch_size: 50
      columns:
      - section_id
      - speaker
      - speech
      - date
      runtime_parameters_info:
      - name: resources
        runtime_parameters_info:
        - name: replicas
          optional: true
          description: The number of replicas for the step.
        - name: cpus
          optional: true
          description: The number of CPUs assigned to each step replica.
        - name: gpus
          optional: true
          description: The number of GPUs assigned to each step replica.
        - name: memory
          optional: true
          description: The memory in bytes required for each step replica.
        - name: resources
          optional: true
          description: A dictionary containing names of custom resources and the number
            of those resources required for each step replica.
      - name: input_batch_size
        optional: true
        description: The number of rows that will contain the batches processed by
          the step.
      type_info:
        module: distilabel.steps.columns.keep
        name: KeepColumns
    name: keep_columns_0
  connections:
  - from: from_db_0
    to:
    - extract_speaker_0
  - from: extract_speaker_0
    to:
    - keep_columns_0
  - from: keep_columns_0
    to: []
  routing_batch_functions: []
  type_info:
    module: distilabel.pipeline.local
    name: Pipeline
requirements: []
