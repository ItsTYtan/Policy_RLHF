distilabel:
  version: 1.5.3
pipeline:
  name: summarize_speeches
  description: null
  steps:
  - step:
      name: from_db_0
      resources:
        replicas: 1
        cpus: null
        gpus: null
        memory: null
        resources: null
      input_mappings: {}
      output_mappings: {}
      use_cache: true
      batch_size: 50
      dbPath: db/axiom.db
      sql: "\n            SELECT *\n            FROM speeches s\n        "
      runtime_parameters_info:
      - name: resources
        runtime_parameters_info:
        - name: replicas
          optional: true
          description: The number of replicas for the step.
        - name: cpus
          optional: true
          description: The number of CPUs assigned to each step replica.
        - name: gpus
          optional: true
          description: The number of GPUs assigned to each step replica.
        - name: memory
          optional: true
          description: The memory in bytes required for each step replica.
        - name: resources
          optional: true
          description: A dictionary containing names of custom resources and the number
            of those resources required for each step replica.
      - name: batch_size
        optional: true
        description: The number of rows that will contain the batches generated by
          the step.
      type_info:
        module: custom_modules.utils
        name: FromDb
    name: from_db_0
  - step:
      name: template_formatter_0
      resources:
        replicas: 1
        cpus: null
        gpus: null
        memory: null
        resources: null
      input_mappings: {}
      output_mappings: {}
      use_cache: true
      input_batch_size: 50
      template: "\n    You are a LLM tasked to summarize a snippet of a Singapore\
        \ Paliamentary Debate shown to you\n\n    Here is the snippet of the paliamentary\
        \ debate: {speech}\n\n    Make sure you remove filler dialogue found in the\
        \ debate and only retain the key ideas, the political stances and rationale\
        \ in the speech.\n    Make sure you only generate the summary in your output\
        \ and nothing else. Do not include things like **Summary:** at the start.\n"
      template_inputs:
      - speech
      runtime_parameters_info:
      - name: resources
        runtime_parameters_info:
        - name: replicas
          optional: true
          description: The number of replicas for the step.
        - name: cpus
          optional: true
          description: The number of CPUs assigned to each step replica.
        - name: gpus
          optional: true
          description: The number of GPUs assigned to each step replica.
        - name: memory
          optional: true
          description: The memory in bytes required for each step replica.
        - name: resources
          optional: true
          description: A dictionary containing names of custom resources and the number
            of those resources required for each step replica.
      - name: input_batch_size
        optional: true
        description: The number of rows that will contain the batches processed by
          the step.
      type_info:
        module: custom_modules.utils
        name: TemplateFormatter
    name: template_formatter_0
  - step:
      name: open_router_l_l_m_0
      resources:
        replicas: 1
        cpus: null
        gpus: null
        memory: null
        resources: null
      input_mappings: {}
      output_mappings: {}
      use_cache: true
      input_batch_size: 50
      model: qwen/qwen-2.5-72b-instruct
      max_tokens: 1024
      temperature: 0.0001
      system_prompt: null
      max_workers: 50
      logprobs: false
      runtime_parameters_info:
      - name: resources
        runtime_parameters_info:
        - name: replicas
          optional: true
          description: The number of replicas for the step.
        - name: cpus
          optional: true
          description: The number of CPUs assigned to each step replica.
        - name: gpus
          optional: true
          description: The number of GPUs assigned to each step replica.
        - name: memory
          optional: true
          description: The memory in bytes required for each step replica.
        - name: resources
          optional: true
          description: A dictionary containing names of custom resources and the number
            of those resources required for each step replica.
      - name: input_batch_size
        optional: true
        description: The number of rows that will contain the batches processed by
          the step.
      type_info:
        module: custom_modules.CustomLLMs
        name: OpenRouterLLM
    name: open_router_l_l_m_0
  - step:
      name: keep_columns_0
      resources:
        replicas: 1
        cpus: null
        gpus: null
        memory: null
        resources: null
      input_mappings: {}
      output_mappings:
        id: speech_id
        generation: summary
      use_cache: true
      input_batch_size: 50
      columns:
      - id
      - speech
      - generation
      - date
      - speaker
      runtime_parameters_info:
      - name: resources
        runtime_parameters_info:
        - name: replicas
          optional: true
          description: The number of replicas for the step.
        - name: cpus
          optional: true
          description: The number of CPUs assigned to each step replica.
        - name: gpus
          optional: true
          description: The number of GPUs assigned to each step replica.
        - name: memory
          optional: true
          description: The memory in bytes required for each step replica.
        - name: resources
          optional: true
          description: A dictionary containing names of custom resources and the number
            of those resources required for each step replica.
      - name: input_batch_size
        optional: true
        description: The number of rows that will contain the batches processed by
          the step.
      type_info:
        module: distilabel.steps.columns.keep
        name: KeepColumns
    name: keep_columns_0
  - step:
      name: to_json_file_0
      resources:
        replicas: 1
        cpus: null
        gpus: null
        memory: null
        resources: null
      input_mappings: {}
      output_mappings: {}
      use_cache: true
      input_batch_size: 50
      filename: speech-summaries
      filepath: cache
      jsonl: true
      runtime_parameters_info:
      - name: resources
        runtime_parameters_info:
        - name: replicas
          optional: true
          description: The number of replicas for the step.
        - name: cpus
          optional: true
          description: The number of CPUs assigned to each step replica.
        - name: gpus
          optional: true
          description: The number of GPUs assigned to each step replica.
        - name: memory
          optional: true
          description: The memory in bytes required for each step replica.
        - name: resources
          optional: true
          description: A dictionary containing names of custom resources and the number
            of those resources required for each step replica.
      - name: input_batch_size
        optional: true
        description: The number of rows that will contain the batches processed by
          the step.
      type_info:
        module: custom_modules.utils
        name: ToJsonFile
    name: to_json_file_0
  connections:
  - from: from_db_0
    to:
    - template_formatter_0
  - from: template_formatter_0
    to:
    - open_router_l_l_m_0
  - from: open_router_l_l_m_0
    to:
    - keep_columns_0
  - from: keep_columns_0
    to:
    - to_json_file_0
  - from: to_json_file_0
    to: []
  routing_batch_functions: []
  type_info:
    module: distilabel.pipeline.local
    name: Pipeline
requirements: []
